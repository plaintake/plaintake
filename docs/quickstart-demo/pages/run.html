<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlainTake quickstart — Record</title>
  <link rel="stylesheet" href="quickstart.css">
</head>
<body>
  <header class="top">
    <span class="wordmark">Plain<span class="take">Take</span></span>
    <span class="crumb">quickstart · 04 — Record</span>
    <span class="site">plaintake.github.io</span>
  </header>

  <main class="stage">
    <section class="card">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">zsh — run</span>
      </div>
      <div class="term">
        <button class="cmd" id="run-cmd">
          <span class="ps">$</span>
          <span>plaintake run examples/release-approval.demo.ts \<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="flag">--output artifacts/release-approval --fixture</span></span>
        </button>
        <div class="out" id="run-out" hidden>
          <span>chromium 1920×1080 · recording 5 steps · 1 assert</span>
          <span>captions <span class="ok">✓</span> render <span class="ok">✓</span></span>
          <span>output/release-approval.mp4 · 14 s · 1080p30 · h264</span>
        </div>
        <p class="note"># --fixture records the bundled demo app; swap in --base-url for yours</p>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('button.cmd[id$="-cmd"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const out = document.getElementById(`${btn.id.replace('-cmd', '')}-out`);
        if (!out || !out.hidden) return;
        out.hidden = false;
        out.classList.add('in');
      });
    });
  </script>
</body>
</html>
