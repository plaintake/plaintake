<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PlainTake quickstart — Watch the output</title>
  <link rel="stylesheet" href="quickstart.css">
</head>
<body>
  <header class="top">
    <span class="wordmark">Plain<span class="take">Take</span></span>
    <span class="crumb">quickstart · the file the run just wrote</span>
    <span class="site">plaintake.github.io</span>
  </header>

  <main class="stage">
    <section class="card">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">out/output/release-approval.mp4</span>
      </div>
      <div class="player-wrap">
        <div class="player">
          <video id="demo-video" muted playsinline preload="auto"></video>
          <div class="overlay" id="overlay">
            <button id="play" aria-label="Play the recorded demo" type="button">
              <svg width="52" height="60" viewBox="0 0 52 60" aria-hidden="true">
                <path d="M2 2 L50 30 L2 58 Z" fill="oklch(57% 0.19 34)"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="meta" id="meta">release-approval.mp4 · 1920×1080 · 30 fps — the exact file the run wrote</p>
      </div>
    </section>
  </main>

  <script>
    // The player embeds the MP4 the terminal's `plaintake run` wrote a few seconds earlier
    // in this same recording, fetched as a blob so playback needs no HTTP Range handling.
    // The scenario waits for window.__demoReady before cutting here, starts playback from
    // this button's click — the declared target of its step — and holds until
    // window.__demoEnded.
    (async () => {
      const video = document.getElementById('demo-video');
      const res = await fetch('assets/example-demo.mp4');
      const blob = await res.blob();
      video.src = URL.createObjectURL(blob);
      await new Promise((resolve) => video.addEventListener('loadedmetadata', resolve, { once: true }));
      document.getElementById('meta').textContent =
        `release-approval.mp4 · ${Math.round(video.duration)} s · 1920×1080 · 30 fps — the exact file the run wrote`;
      video.addEventListener('ended', () => { window.__demoEnded = true; }, { once: true });
      video.pause();
      await document.fonts.ready;
      window.__demoReady = true;
    })();

    document.getElementById('play').addEventListener('click', () => {
      document.getElementById('overlay').hidden = true;
      document.getElementById('demo-video').play();
    });
  </script>
</body>
</html>
